<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PSU Quiz Builder — คลังข้อสอบส่วนตัว</title>
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<style>
  :root{
    --ink:#1c2b30;
    --paper:#f6f3ea;
    --paper2:#ffffff;
    --line:#d8d0bd;
    --teal:#1f5f5b;
    --teal-dark:#123a37;
    --clay:#b5563f;
    --good:#2f6b3a;
    --bad:#a3312a;
    --muted:#7a7264;
    font-family: "IBM Plex Sans Thai", "Sarabun", "Noto Sans Thai", system-ui, sans-serif;
  }
  *{box-sizing:border-box;}
  body{margin:0; background:var(--paper); color:var(--ink); min-height:100vh;}
  .topbar{
    background:var(--teal-dark); color:#f6f3ea; padding:18px 24px;
    display:flex; align-items:baseline; gap:14px; flex-wrap:wrap;
    border-bottom:4px solid var(--clay);
  }
  .topbar h1{font-size:1.25rem; margin:0; letter-spacing:.02em; font-weight:700;}
  .topbar .tag{font-size:.78rem; color:#c9d9d6; font-family:"JetBrains Mono", monospace; letter-spacing:.05em;}
  .tabs{display:flex; gap:2px; background:var(--teal-dark); padding:0 24px; flex-wrap:wrap;}
  .tabs button{
    background:transparent; border:none; color:#cfe0dd; padding:10px 14px;
    font-size:.88rem; cursor:pointer; border-radius:6px 6px 0 0; font-family:inherit;
  }
  .tabs button.active{background:var(--paper); color:var(--teal-dark); font-weight:700;}
  main{max-width:960px; margin:0 auto; padding:28px 20px 80px;}
  .panel{background:var(--paper2); border:1px solid var(--line); border-radius:10px; padding:22px; margin-bottom:18px;}
  h2{margin-top:0; font-size:1.05rem; color:var(--teal-dark); border-bottom:2px solid var(--line); padding-bottom:8px;}
  label{font-size:.85rem; color:var(--muted); display:block; margin-bottom:4px;}
  input[type=text], textarea, select{
    width:100%; font-family:inherit; font-size:.95rem; border:1px solid var(--line);
    border-radius:6px; padding:8px 10px; background:#fff; color:var(--ink);
  }
  textarea{resize:vertical;}
  button.btn{
    background:var(--teal); color:#fff; border:none; padding:9px 16px; border-radius:6px;
    cursor:pointer; font-size:.9rem; font-family:inherit; font-weight:600;
  }
  button.btn:hover{background:var(--teal-dark);}
  button.btn.secondary{background:transparent; color:var(--teal-dark); border:1px solid var(--teal);}
  button.btn.danger{background:var(--bad);}
  button.btn.clay{background:var(--clay);}
  button.btn.ghost{background:transparent; color:var(--muted); border:1px solid var(--line);}
  button.btn:disabled{opacity:.4; cursor:not-allowed;}
  .row{display:flex; gap:10px; flex-wrap:wrap; align-items:center;}
  .card{
    border:1px solid var(--line); border-radius:8px; padding:12px 14px; margin-bottom:10px;
    display:flex; justify-content:space-between; align-items:center; gap:10px; flex-wrap:wrap;
    background:#fffdf8;
  }
  .card .meta{font-size:.8rem; color:var(--muted);}
  .card .name{font-weight:700; color:var(--teal-dark); font-size:1.02rem;}
  .qcard{border:1px solid var(--line); border-radius:8px; padding:14px; margin-bottom:12px; background:#fffdf8;}
  .qcard .qnum{font-family:"JetBrains Mono", monospace; color:var(--clay); font-weight:700; font-size:.85rem; margin-bottom:6px;}
  .choice-edit{display:flex; gap:6px; align-items:center; margin-bottom:6px;}
  .choice-edit span{width:18px; font-weight:700; color:var(--teal-dark);}
  .quiz-progress{font-family:"JetBrains Mono", monospace; font-size:.85rem; color:var(--muted); margin-bottom:10px;}
  .mode-tag{
    display:inline-block; font-size:.72rem; padding:2px 10px; border-radius:20px;
    font-family:"JetBrains Mono", monospace; background:#e4efee; color:var(--teal-dark); margin-left:8px;
  }
  .quiz-q{font-size:1.02rem; line-height:1.6; white-space:pre-wrap; margin-bottom:16px;}
  .choice-btn{
    display:block; width:100%; text-align:left; background:#fff; border:1px solid var(--line);
    border-radius:8px; padding:10px 14px; margin-bottom:8px; cursor:pointer; font-size:.95rem;
    font-family:inherit; color:var(--ink); line-height:1.5; white-space:pre-wrap;
  }
  .choice-btn:hover{border-color:var(--teal);}
  .choice-btn.selected{background:#e4efee; border-color:var(--teal); font-weight:600;}
  .choice-btn.correct{border-color:var(--good); background:#e7f2e8; font-weight:600;}
  .choice-btn.incorrect{border-color:var(--bad); background:#fbe9e7;}
  .choice-btn:disabled{cursor:default;}
  .reveal-box{
    border:1px solid var(--line); border-radius:8px; padding:12px 14px; margin:10px 0 4px;
    background:#f1ecd8;
  }
  .reveal-box.ok{border-left:5px solid var(--good);}
  .reveal-box.no{border-left:5px solid var(--bad);}
  .nav-row{display:flex; justify-content:space-between; margin-top:18px; gap:8px;}
  .score-hero{text-align:center; padding:30px 10px;}
  .score-hero .num{font-size:3.2rem; font-weight:800; color:var(--teal-dark); font-family:"JetBrains Mono", monospace;}
  .score-hero .sub{color:var(--muted); font-size:.95rem;}
  .review-row{border:1px solid var(--line); border-radius:8px; padding:12px 14px; margin-bottom:10px;}
  .review-row.wrong{border-left:5px solid var(--bad);}
  .review-row.right{border-left:5px solid var(--good);}
  .badge{display:inline-block; font-size:.72rem; padding:2px 8px; border-radius:20px; font-family:"JetBrains Mono", monospace; margin-left:6px;}
  .badge.ok{background:#e7f2e8; color:var(--good);}
  .badge.no{background:#fbe9e7; color:var(--bad);}
  .badge.pending{background:#f1ecd8; color:var(--muted);}
  .empty{color:var(--muted); font-size:.9rem; padding:20px 0; text-align:center;}
  .small{font-size:.8rem; color:var(--muted);}
  .flex-between{display:flex; justify-content:space-between; align-items:center; gap:10px; flex-wrap:wrap;}
  hr.sep{border:none; border-top:1px solid var(--line); margin:16px 0;}
  .crumb{font-size:.85rem; color:var(--muted); margin-bottom:10px;}
  .crumb button{background:none; border:none; color:var(--teal); cursor:pointer; font-size:.85rem; padding:0; font-family:inherit; text-decoration:underline;}
</style>
</head>
<body>

<div class="topbar">
  <h1>EXAM Quiz Builder</h1>
  <span class="tag">ทำงานในเบราว์เซอร์ล้วนๆ · ไม่ส่งข้อมูลออกจากเครื่อง · ไม่ใช้ API · build 2026-08-17.2</span>
</div>

<div class="tabs" id="tabs"></div>
<main id="main"></main>

<script>
pdfjsLib.GlobalWorkerOptions.workerSrc = "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";

/* ---------------- storage keys ---------------- */
const PROJECTS_KEY = "psu_quiz_projects_v2";
const OLD_EXAMS_KEY = "psu_quiz_exams_v1"; // legacy flat format, migrated on first load

/* ---------------- state ---------------- */
let state = {
  projects: [],            // [{id, name, exams:[{id,name,questions:[...]}]}]
  activeTab: "import",
  currentProjectId: null,  // when set, Projects tab shows exams inside this project
  currentExamId: null,     // for editor tab
  editReviewOnly: false,   // show only parser-flagged questions in the editor
  rawText: "",
  parsedPreview: [],
  quiz: { examId:null, mode:"exam", order:[], idx:0, answers:{}, revealed:false },
  lastResult: null
};

function uid(){ return Math.random().toString(36).slice(2,10); }

function save(){
  localStorage.setItem(PROJECTS_KEY, JSON.stringify(state.projects));
}

function load(){
  try{
    const rawNew = localStorage.getItem(PROJECTS_KEY);
    if(rawNew){ state.projects = JSON.parse(rawNew); return; }
  }catch(e){}
  // migrate legacy flat exam list into a default project, if present
  try{
    const rawOld = localStorage.getItem(OLD_EXAMS_KEY);
    if(rawOld){
      const oldExams = JSON.parse(rawOld);
      if(Array.isArray(oldExams) && oldExams.length){
        state.projects = [{id:uid(), name:"ข้อสอบที่นำเข้าไว้ก่อนหน้า", exams: oldExams}];
        save();
        return;
      }
    }
  }catch(e){}
  state.projects = [];
}

function findExam(examId){
  for(const p of state.projects){
    const e = (p.exams||[]).find(x=>x.id===examId);
    if(e) return {exam:e, project:p};
  }
  return null;
}

/* ---------------- PDF -> text ---------------- */
async function extractPdfText(file){
  const buf = await file.arrayBuffer();
  const pdf = await pdfjsLib.getDocument({data: buf}).promise;
  const pages = [];

  // Repeated text at the very top/bottom of pages is normally a header or footer,
  // not part of a question. Remember it before joining pages together.
  for(let p=1;p<=pdf.numPages;p++){
    const page = await pdf.getPage(p);
    const content = await page.getTextContent();
    const rows = [];
    for(const item of content.items){
      const y = item.transform[5];
      let row = rows.find(r=>Math.abs(r.y-y) <= 2);
      if(!row){ row = {y, items:[]}; rows.push(row); }
      row.items.push({x:item.transform[4], text:item.str});
    }
    rows.sort((a,b)=>b.y-a.y).forEach(r=>r.items.sort((a,b)=>a.x-b.x));
    pages.push({
      height: page.getViewport({scale:1}).height,
      rows: rows.map(r=>({y:r.y, text:r.items.map(i=>i.text).join("").trim()})).filter(r=>r.text)
    });
  }

  const repeatedMargins = new Map();
  pages.forEach((page,pageIndex)=>{
    page.rows.forEach(row=>{
      const inMargin = row.y > page.height*.84 || row.y < page.height*.16;
      if(!inMargin) return;
      const key = row.text.replace(/\s+/g," ").trim().toLowerCase();
      if(!key) return;
      if(!repeatedMargins.has(key)) repeatedMargins.set(key, new Set());
      repeatedMargins.get(key).add(pageIndex);
    });
  });
  const noise = new Set([...repeatedMargins].filter(([,seen])=>seen.size>=2).map(([key])=>key));
  return pages.flatMap(page=>page.rows
    .filter(row=>!noise.has(row.text.replace(/\s+/g," ").trim().toLowerCase()))
    .map(row=>row.text)
  ).join("\n");
}

/* ---------------- parser: text -> questions ---------------- */
function parseQuestions(text){
  // Choices may be indented with a TAB and use lowercase a.–e. (as in copied MCQs).
  // Normalize line endings so the same parser works with text from Windows, macOS, and iOS.
  const lines = text.replace(/\r\n?/g, "\n").split("\n");
  const blocks = [];
  let current = null;
  // PDFs may write a number as "1.", "1 .", or "1.โจทย์".
  const qStart = /^\s*(\d{1,3})\s*[\.\)]\s*(.*\S)\s*$/;
  const isMetadata = value => /^(?:ข้อสอบ|นักศึกษา|หมายเหตุ)|(?:คะแนนเต็ม|จำนวนผู้สอบ|ฝ่ายวิชาการ|\bMAX\b|\bMIN\b|\bMEAN\b|\bS\.D\.)/i.test(value.trim());
  for(const raw of lines){
    const m = raw.match(qStart);
    if(m && parseInt(m[1],10) < 300 && !isMetadata(m[2])){
      if(current) blocks.push(current);
      current = {number: m[1], lines:[m[2]]};
    } else if(current){
      current.lines.push(raw);
    }
  }
  if(current) blocks.push(current);

  // \s* includes TAB indentation; the i flag accepts both a.–e. and A.–E.
  const choiceRe = /^\s*([A-E])[\.\)]\s*(.*)$/i;
  const questions = [];
  for(const b of blocks){
    const stemLines = [];
    const choices = {A:"",B:"",C:"",D:"",E:""};
    let inChoices = false;
    for(const ln of b.lines){
      const cm = ln.match(choiceRe);
      if(cm){
        inChoices = true;
        const letter = cm[1].toUpperCase();
        choices[letter] = (choices[letter] ? choices[letter]+" " : "") + cm[2].trim();
      } else if(inChoices){
        const letters = ["A","B","C","D","E"];
        for(let i=letters.length-1;i>=0;i--){
          if(choices[letters[i]]){ choices[letters[i]] += " " + ln.trim(); break; }
        }
      } else {
        stemLines.push(ln);
      }
    }
    let stem = stemLines.join("\n").trim();
    const choiceCount = Object.values(choices).filter(Boolean).length;
    // A number with no usable text and no choices is usually PDF noise; do not create
    // a blank question. If choices exist, keep the item so its original numbering survives.
    if(!stem && choiceCount===0) continue;
    const issues = [];
    if(!stem){
      stem = "[ไม่พบข้อความโจทย์ — กรุณาตรวจ PDF ต้นฉบับ]";
      issues.push("ไม่พบข้อความโจทย์");
    }
    if(choiceCount===0) issues.push("ไม่พบตัวเลือก");
    else if(choiceCount<2) issues.push(`พบตัวเลือกเพียง ${choiceCount} ตัว`);
    questions.push({
      id: uid(), number: b.number, sourceNumber:b.number, stem, choices, issues,
      correct: null, explanation: "", image: null
    });
  }
  const usedNumbers = new Set();
  questions.forEach(q=>{
    if(usedNumbers.has(q.number)) q.issues.push(`เลขข้อ ${q.number} ซ้ำในข้อความต้นฉบับ`);
    usedNumbers.add(q.number);
  });
  return questions;
}

/* ---------------- flexible answer-key parser ---------------- */
let pendingKeyImport = null;

function parseAnswerKeyFlexible(text){
  const lines = text.split("\n");
  const blocks = [];
  let current = null;
  const numRe = /^\s*#{0,4}\s*\**\s*(?:ข้อ(?:ที่)?\s*)?(\d{1,3})\s*[\.\):\：]?\s*\**\s*(.*)$/;
  for(const raw of lines){
    const m = raw.match(numRe);
    const n = m ? parseInt(m[1],10) : NaN;
    if(m && n>0 && n<300){
      if(current) blocks.push(current);
      current = {number:m[1], lines:[m[2]]};
    } else if(current){
      current.lines.push(raw);
    }
  }
  if(current) blocks.push(current);

  const explicitAnsRe = /(?:ตอบ|เฉลย|answer|ans|correct\s*answer)\s*[:\-]?\s*\**\(?([A-E])\)?\**/i;
  const bareLetterRe = /^\**\(?([A-E])\)?\**\s*[:\.\-]?\s*$/;
  const leadLetterRe = /^\**\(?([A-E])\)?\**[\s\.\:\-]/;
  const explPrefixRe = /^\s*\**(เหตุผล|คำอธิบาย|explanation|rationale)\s*[:\-]\s*\**/i;

  return blocks.map(b=>{
    const full = b.lines.slice();
    let letter = null, ansLineIndex = -1;

    for(let i=0;i<full.length;i++){
      const m = full[i].match(explicitAnsRe);
      if(m){ letter = m[1].toUpperCase(); ansLineIndex = i; break; }
    }
    if(!letter){
      for(let i=0;i<full.length;i++){
        const trimmed = full[i].trim();
        if(!trimmed) continue;
        const m = trimmed.match(bareLetterRe) || trimmed.match(leadLetterRe);
        if(m){ letter = m[1].toUpperCase(); ansLineIndex = i; }
        break;
      }
    }

    let explLines = full.slice();
    if(ansLineIndex>=0){
      let ln = explLines[ansLineIndex];
      ln = ln.replace(explicitAnsRe,"").replace(bareLetterRe,"").replace(leadLetterRe,"").trim();
      explLines[ansLineIndex] = ln;
    }
    let explanation = explLines.join("\n").trim();
    explanation = explanation.replace(explPrefixRe,"").trim();
    explanation = explanation.replace(/\n{3,}/g,"\n\n");

    return {number: b.number, letter, explanation};
  });
}

/* ---------------- export / import with location choice ---------------- */
async function exportJSON(data, filename){
  const json = JSON.stringify(data, null, 2);

  // Desktop: native save-file dialog (choose exact folder + filename)
  if(window.showSaveFilePicker){
    try{
      const handle = await window.showSaveFilePicker({
        suggestedName: filename,
        types: [{description:"JSON", accept:{"application/json":[".json"]}}]
      });
      const writable = await handle.createWritable();
      await writable.write(json);
      await writable.close();
      return;
    }catch(e){
      if(e && e.name === "AbortError") return; // user cancelled
      // fall through to next method
    }
  }

  // iOS / mobile Safari: Web Share sheet lets user "Save to Files" and pick a folder
  try{
    const blob = new Blob([json], {type:"application/json"});
    const file = new File([blob], filename, {type:"application/json"});
    if(navigator.canShare && navigator.canShare({files:[file]})){
      await navigator.share({files:[file], title:filename});
      return;
    }
  }catch(e){
    if(e && e.name === "AbortError") return;
  }

  // fallback: plain download (goes to default Downloads location)
  const blob = new Blob([json], {type:"application/json"});
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = filename;
  a.click();
}

/* ---------------- GitHub-repo sync (pull data.json hosted alongside index.html) ---------------- */
async function fetchRemoteData(){
  const url = "./data.json?t=" + Date.now(); // cache-bust so we always get the latest committed file
  const res = await fetch(url, {cache:"no-store"});
  if(!res.ok){
    throw new Error(`ไม่พบไฟล์ data.json ใน repo (HTTP ${res.status}) — อัปโหลด data.json ไว้ตำแหน่งเดียวกับ index.html หรือยัง?`);
  }
  const data = await res.json();
  if(!Array.isArray(data)) throw new Error("รูปแบบไฟล์ data.json ไม่ถูกต้อง");
  return data;
}

function mergeProjectsFromRemote(remoteProjects, mode){
  if(mode === "replace"){
    state.projects = remoteProjects;
  } else {
    remoteProjects.forEach(rp=>{
      const idx = state.projects.findIndex(p=>p.id===rp.id);
      if(idx>=0) state.projects[idx] = rp;
      else state.projects.push(rp);
    });
  }
  save();
  render();
}

async function autoSyncIfEmpty(){
  if(state.projects.length > 0) return; // only auto-pull on a fresh/empty device, never overwrite existing data silently
  try{
    const remote = await fetchRemoteData();
    if(remote.length > 0){
      state.projects = remote;
      save();
      render();
    }
  }catch(e){
    // no data.json published yet, or fetch failed — silently ignore, this is just a convenience auto-pull
  }
}

/* ---------------- image attach (per question) ---------------- */
function compressImageFile(file, maxW){
  return new Promise((resolve, reject)=>{
    const reader = new FileReader();
    reader.onerror = reject;
    reader.onload = ()=>{
      const img = new Image();
      img.onerror = reject;
      img.onload = ()=>{
        const scale = Math.min(1, (maxW||1000)/img.width);
        const w = Math.round(img.width*scale);
        const h = Math.round(img.height*scale);
        const canvas = document.createElement("canvas");
        canvas.width = w; canvas.height = h;
        canvas.getContext("2d").drawImage(img,0,0,w,h);
        resolve(canvas.toDataURL("image/jpeg", 0.72));
      };
      img.src = reader.result;
    };
    reader.readAsDataURL(file);
  });
}

function renderImageArea(container, q){
  if(!container) return;
  container.innerHTML = "";
  if(q.image){
    const wrap = document.createElement("div");
    wrap.style.marginBottom = "8px";
    const img = document.createElement("img");
    img.src = q.image;
    img.style.maxWidth = "260px";
    img.style.maxHeight = "220px";
    img.style.display = "block";
    img.style.border = "1px solid var(--line)";
    img.style.borderRadius = "6px";
    img.style.marginBottom = "6px";
    wrap.appendChild(img);
    const rmBtn = document.createElement("button");
    rmBtn.className = "btn danger";
    rmBtn.style.padding = "4px 10px";
    rmBtn.style.fontSize = ".78rem";
    rmBtn.textContent = "ลบรูปนี้";
    rmBtn.onclick = ()=>{ q.image = null; save(); renderImageArea(container, q); };
    wrap.appendChild(rmBtn);
    container.appendChild(wrap);
  } else {
    const label = document.createElement("label");
    label.className = "btn secondary";
    label.style.cursor = "pointer";
    label.style.display = "inline-block";
    label.textContent = "📷 แนบรูป (ถ่ายรูปหรือเลือกจากคลังภาพ)";
    const input = document.createElement("input");
    input.type = "file";
    input.accept = "image/*";
    input.style.display = "none";
    input.addEventListener("change", async (e)=>{
      const f = e.target.files[0];
      if(!f) return;
      label.textContent = "กำลังบีบอัดรูป...";
      try{
        const dataUrl = await compressImageFile(f, 1000);
        q.image = dataUrl;
        save();
        renderImageArea(container, q);
      }catch(err){
        alert("แนบรูปไม่สำเร็จ: " + err.message);
        renderImageArea(container, q);
      }
    });
    label.appendChild(input);
    container.appendChild(label);
  }
}

/* ---------------- tabs / router ---------------- */
const TABS = [
  {id:"import",   label:"① นำเข้า PDF"},
  {id:"projects", label:"② โปรเจกต์"},
  {id:"edit",     label:"③ แก้ไข/เฉลย"},
  {id:"quiz",     label:"④ ทำข้อสอบ"},
  {id:"result",   label:"⑤ ผลคะแนน"},
];

function renderTabs(){
  const el = document.getElementById("tabs");
  el.innerHTML = "";
  TABS.forEach(t=>{
    const b = document.createElement("button");
    b.textContent = t.label;
    b.className = state.activeTab===t.id ? "active" : "";
    b.onclick = ()=>{ state.activeTab = t.id; render(); };
    el.appendChild(b);
  });
}

function render(){
  renderTabs();
  const main = document.getElementById("main");
  main.innerHTML = "";
  if(state.activeTab==="import")   main.appendChild(renderImport());
  if(state.activeTab==="projects") main.appendChild(renderProjects());
  if(state.activeTab==="edit")     main.appendChild(renderEdit());
  if(state.activeTab==="quiz")     main.appendChild(renderQuiz());
  if(state.activeTab==="result")   main.appendChild(renderResult());
}

/* ---------------- TAB: import ---------------- */
function renderImport(){
  const wrap = document.createElement("div");

  const p1 = document.createElement("div");
  p1.className = "panel";
  p1.innerHTML = `
    <h2>1. อัปโหลดไฟล์ PDF ข้อสอบ</h2>
    <p class="small">เลือกไฟล์ PDF ได้ทีละไฟล์ ระบบจะดึงข้อความออกมาให้ในกล่องด้านล่าง — ตรวจสอบ/แก้คำผิดจาก OCR ได้ก่อนแยกข้อ</p>
    <input type="file" id="pdfFile" accept="application/pdf" />
    <div id="pdfStatus" class="small" style="margin-top:8px;"></div>
  `;
  wrap.appendChild(p1);

  const p2 = document.createElement("div");
  p2.className = "panel";
  p2.innerHTML = `
    <h2>2. ข้อความดิบ (แก้ไขได้ก่อนแยกข้อ)</h2>
    <textarea id="rawTextBox" rows="12" placeholder="วางข้อความข้อสอบที่นี่ หรืออัปโหลด PDF ด้านบน">${escapeHtml(state.rawText)}</textarea>
    <div class="row" style="margin-top:10px;">
      <button class="btn" id="parseBtn">แยกข้อสอบอัตโนมัติ</button>
      <span class="small">รูปแบบที่รองรับ: ข้อขึ้นต้นด้วยเลข "1." ตัวเลือกขึ้นต้นด้วย "A." ถึง "E."</span>
    </div>
  `;
  wrap.appendChild(p2);

  const p3 = document.createElement("div");
  p3.className = "panel";
  p3.innerHTML = `<h2>3. ตัวอย่างที่แยกได้</h2><div id="previewBox"></div>`;
  wrap.appendChild(p3);

  const p4 = document.createElement("div");
  p4.className = "panel";
  const projectOptions = state.projects.map(p=>`<option value="${p.id}">${escapeHtml(p.name)}</option>`).join("");
  p4.innerHTML = `
    <h2>4. บันทึกเข้าโปรเจกต์ (บล็อกวิชา)</h2>
    <label>โปรเจกต์ปลายทาง</label>
    <select id="targetProjectSelect">
      <option value="__new__">+ สร้างโปรเจกต์ใหม่</option>
      ${projectOptions}
    </select>
    <div id="newProjectNameWrap" style="margin-top:8px;">
      <label>ชื่อโปรเจกต์ใหม่</label>
      <input type="text" id="newProjectNameInput" placeholder="เช่น Respiratory Block">
    </div>
    <label style="margin-top:10px;">ชื่อชุดข้อสอบ</label>
    <input type="text" id="examNameInput" placeholder="เช่น Respiratory MED 44" />
    <div class="row" style="margin-top:10px;">
      <button class="btn clay" id="saveExamBtn" disabled>บันทึกชุดข้อสอบนี้</button>
    </div>
  `;
  wrap.appendChild(p4);

  setTimeout(()=>{
    document.getElementById("pdfFile").addEventListener("change", async (e)=>{
      const f = e.target.files[0];
      if(!f) return;
      const statusEl = document.getElementById("pdfStatus");
      statusEl.textContent = "กำลังอ่านไฟล์...";
      try{
        const text = await extractPdfText(f);
        state.rawText = text;
        document.getElementById("rawTextBox").value = text;
        statusEl.textContent = "อ่านไฟล์สำเร็จ: " + f.name;
        if(!document.getElementById("examNameInput").value){
          document.getElementById("examNameInput").value = f.name.replace(/\.pdf$/i,"");
        }
      }catch(err){
        statusEl.textContent = "อ่านไฟล์ไม่สำเร็จ: " + err.message;
      }
    });

    document.getElementById("parseBtn").addEventListener("click", ()=>{
      state.rawText = document.getElementById("rawTextBox").value;
      state.parsedPreview = parseQuestions(state.rawText);
      renderPreview();
      document.getElementById("saveExamBtn").disabled = state.parsedPreview.length===0;
    });

    const targetSel = document.getElementById("targetProjectSelect");
    const newWrap = document.getElementById("newProjectNameWrap");
    function syncNewProjectVisibility(){
      newWrap.style.display = targetSel.value === "__new__" ? "block" : "none";
    }
    targetSel.addEventListener("change", syncNewProjectVisibility);
    syncNewProjectVisibility();

    document.getElementById("saveExamBtn").addEventListener("click", ()=>{
      const examName = document.getElementById("examNameInput").value.trim() || ("ชุดข้อสอบ " + Date.now());
      let project;
      if(targetSel.value === "__new__"){
        const pname = document.getElementById("newProjectNameInput").value.trim() || "โปรเจกต์ใหม่";
        project = {id: uid(), name: pname, exams: []};
        state.projects.push(project);
      } else {
        project = state.projects.find(p=>p.id===targetSel.value);
      }
      if(!project) return;
      project.exams.push({id: uid(), name: examName, questions: state.parsedPreview});
      save();
      state.rawText = "";
      state.parsedPreview = [];
      state.currentProjectId = project.id;
      state.activeTab = "projects";
      render();
    });

    renderPreview();
  },0);

  function renderPreview(){
    const box = document.getElementById("previewBox");
    if(!box) return;
    if(state.parsedPreview.length===0){
      box.innerHTML = `<div class="empty">ยังไม่ได้แยกข้อ — กด "แยกข้อสอบอัตโนมัติ" ด้านบน</div>`;
      return;
    }
    const flagged = state.parsedPreview.filter(q=>(q.issues||[]).length);
    box.innerHTML = `<p class="small">พบทั้งหมด ${state.parsedPreview.length} ข้อ · เลขข้อจะคงตาม PDF ต้นฉบับ — ไปแก้ไขรายละเอียด/ใส่เฉลยได้ที่แท็บ "แก้ไข/เฉลย" หลังบันทึก</p>` +
      (flagged.length ? `<p class="small" style="color:var(--clay);">⚠️ มี ${flagged.length} ข้อที่ต้องตรวจ (เช่น โจทย์หรือตัวเลือกไม่ครบ) ระบบจะไม่สร้างข้อว่างจากหัว/ท้ายกระดาษ</p>` : "");
    state.parsedPreview.slice(0,3).forEach(q=>{
      const d = document.createElement("div");
      d.className = "qcard";
      const warning = (q.issues||[]).length ? `<div class="small" style="color:var(--clay); margin-top:5px;">⚠️ ${escapeHtml(q.issues.join(" · "))}</div>` : "";
      d.innerHTML = `<div class="qnum">ข้อจริง ${q.number}</div><div>${escapeHtml(q.stem).slice(0,300)}</div>${warning}`;
      box.appendChild(d);
    });
    if(state.parsedPreview.length>3){
      const more = document.createElement("div");
      more.className="small";
      more.textContent = `...และอีก ${state.parsedPreview.length-3} ข้อ`;
      box.appendChild(more);
    }
  }

  return wrap;
}

/* ---------------- TAB: projects ---------------- */
function renderProjects(){
  const wrap = document.createElement("div");

  if(!state.currentProjectId){
    // ---- project list view ----
    const panel = document.createElement("div");
    panel.className = "panel";
    panel.innerHTML = `
      <div class="flex-between">
        <h2 style="border:none; margin:0;">โปรเจกต์ (บล็อกวิชา) — ${state.projects.length} โปรเจกต์</h2>
        <button class="btn" id="newProjBtn">+ สร้างโปรเจกต์</button>
      </div>
    `;
    if(state.projects.length===0){
      panel.innerHTML += `<div class="empty">ยังไม่มีโปรเจกต์ — สร้างใหม่ หรือไปนำเข้า PDF ที่แท็บ "① นำเข้า PDF" ก่อน</div>`;
    } else {
      state.projects.forEach(p=>{
        const examCount = (p.exams||[]).length;
        const card = document.createElement("div");
        card.className = "card";
        card.innerHTML = `
          <div>
            <div class="name">📁 ${escapeHtml(p.name)}</div>
            <div class="meta">${examCount} ชุดข้อสอบ</div>
          </div>
          <div class="row">
            <button class="btn" data-act="open">เปิดโปรเจกต์</button>
            <button class="btn ghost" data-act="rename">แก้ชื่อ</button>
            <button class="btn danger" data-act="del">ลบ</button>
          </div>
        `;
        card.querySelector('[data-act="open"]').onclick = ()=>{
          state.currentProjectId = p.id; render();
        };
        card.querySelector('[data-act="rename"]').onclick = ()=>{
          const n = prompt("ตั้งชื่อโปรเจกต์ใหม่:", p.name);
          if(n && n.trim()){ p.name = n.trim(); save(); render(); }
        };
        card.querySelector('[data-act="del"]').onclick = ()=>{
          if(confirm(`ลบโปรเจกต์ "${p.name}" พร้อมชุดข้อสอบทั้งหมดข้างใน (${examCount} ชุด) ?`)){
            state.projects = state.projects.filter(x=>x.id!==p.id);
            save(); render();
          }
        };
        panel.appendChild(card);
      });
    }
    wrap.appendChild(panel);

    // GitHub sync panel
    const sync = document.createElement("div");
    sync.className = "panel";
    sync.innerHTML = `
      <h2>🔄 ซิงก์ข้ามเครื่องผ่าน GitHub</h2>
      <p class="small">
        วิธีใช้: กด "ส่งออก data.json" บนเครื่องที่มีข้อมูลล่าสุด → อัปโหลดไฟล์ <code>data.json</code> นั้นเข้า repo เดียวกับ
        <code>index.html</code> บน GitHub (วางไว้ตำแหน่งเดียวกัน) → แล้วมาเครื่องอื่น กดปุ่ม "ดึงข้อมูลจาก GitHub"
        ด้านล่าง ระบบจะโหลด <code>data.json</code> ล่าสุดจาก repo มารวมเข้ากับข้อมูลในเครื่องนี้ให้อัตโนมัติ
      </p>
      <div class="row">
        <button class="btn clay" id="exportAllBtn">📤 ส่งออก data.json</button>
        <button class="btn" id="syncPullBtn">📥 ดึงข้อมูลจาก GitHub</button>
      </div>
      <div id="syncStatus" class="small" style="margin-top:8px;"></div>
    `;
    wrap.appendChild(sync);

    // manual backup / restore (separate from the GitHub-sync file)
    const io = document.createElement("div");
    io.className = "panel";
    io.innerHTML = `
      <h2>สำรองข้อมูลด้วยตัวเอง</h2>
      <div class="row">
        <button class="btn secondary" id="exportBackupBtn">ส่งออกไฟล์สำรอง (ตั้งชื่อเอง)</button>
        <label class="btn secondary" style="cursor:pointer;">
          นำเข้าไฟล์ JSON
          <input type="file" id="importFile" accept="application/json" style="display:none;">
        </label>
      </div>
      <p class="small">กด "ส่งออก" แล้วเลือกตำแหน่งที่จะเซฟไฟล์ได้เอง (บน iOS จะเด้งหน้าต่างแชร์ให้เลือก "บันทึกลงใน Files" แล้วเลือกโฟลเดอร์) ข้อมูลทั้งหมดเก็บอยู่ในเบราว์เซอร์นี้เท่านั้น</p>
    `;
    wrap.appendChild(io);

    setTimeout(()=>{
      document.getElementById("newProjBtn").onclick = ()=>{
        const n = prompt("ตั้งชื่อโปรเจกต์ใหม่ (เช่น ชื่อบล็อกวิชา):", "");
        if(n && n.trim()){
          const proj = {id:uid(), name:n.trim(), exams:[]};
          state.projects.push(proj);
          save();
          state.currentProjectId = proj.id;
          render();
        }
      };
      document.getElementById("exportAllBtn").onclick = ()=>{
        exportJSON(state.projects, "data.json");
      };
      document.getElementById("exportBackupBtn").onclick = ()=>{
        exportJSON(state.projects, "psu_quiz_backup_" + Date.now() + ".json");
      };
      document.getElementById("syncPullBtn").onclick = async ()=>{
        const statusEl = document.getElementById("syncStatus");
        statusEl.textContent = "กำลังดึงข้อมูลจาก GitHub...";
        try{
          const remote = await fetchRemoteData();
          const mergeIt = confirm(
            `เจอ data.json บน GitHub (${remote.length} โปรเจกต์)\n\n` +
            `กด OK เพื่อ "รวม" เข้ากับข้อมูลในเครื่องนี้ (โปรเจกต์ id ซ้ำจะถูกอัปเดตทับด้วยเวอร์ชันจาก GitHub)\n` +
            `กด Cancel เพื่อยกเลิก`
          );
          if(mergeIt){
            mergeProjectsFromRemote(remote, "merge");
            statusEl.textContent = "ซิงก์สำเร็จ ✅";
          } else {
            statusEl.textContent = "ยกเลิกการซิงก์";
          }
        }catch(err){
          statusEl.textContent = "ดึงข้อมูลไม่สำเร็จ: " + err.message;
        }
      };
      document.getElementById("importFile").onchange = async (e)=>{
        const f = e.target.files[0];
        if(!f) return;
        const text = await f.text();
        try{
          const data = JSON.parse(text);
          if(Array.isArray(data) && data.length && data[0].exams){
            // new project-array format
            state.projects = state.projects.concat(data);
          } else if(Array.isArray(data)){
            // legacy flat exam-array format
            state.projects.push({id:uid(), name:"นำเข้า " + new Date().toLocaleDateString("th-TH"), exams: data});
          } else {
            alert("รูปแบบไฟล์ไม่ถูกต้อง");
            return;
          }
          save(); render();
        }catch(err){ alert("ไฟล์ไม่ถูกต้อง: " + err.message); }
      };
    },0);

    return wrap;
  }

  // ---- inside a project: exam list view ----
  const project = state.projects.find(p=>p.id===state.currentProjectId);
  if(!project){
    state.currentProjectId = null;
    return renderProjects();
  }

  const crumb = document.createElement("div");
  crumb.className = "crumb";
  crumb.innerHTML = `<button id="backBtn">← โปรเจกต์ทั้งหมด</button> / ${escapeHtml(project.name)}`;
  wrap.appendChild(crumb);

  const panel = document.createElement("div");
  panel.className = "panel";
  panel.innerHTML = `
    <div class="flex-between">
      <h2 style="border:none; margin:0;">📁 ${escapeHtml(project.name)}</h2>
      <button class="btn secondary" id="exportProjBtn">ส่งออกโปรเจกต์นี้ (JSON)</button>
    </div>
    <p class="small">ชุดข้อสอบทั้งหมดใน "${escapeHtml(project.name)}" — เลือกโหมดทำข้อสอบได้ 2 แบบต่อชุด</p>
  `;

  if((project.exams||[]).length===0){
    panel.innerHTML += `<div class="empty">โปรเจกต์นี้ยังไม่มีชุดข้อสอบ — ไปที่แท็บ "① นำเข้า PDF" แล้วเลือกโปรเจกต์นี้เป็นปลายทาง</div>`;
  } else {
    project.exams.forEach((ex, examIndex)=>{
      const answered = ex.questions.filter(q=>q.correct).length;
      const hist = ex.history || {exam:[], practice:[]};
      const lastExam = hist.exam && hist.exam[0];
      const lastPractice = hist.practice && hist.practice[0];
      const hasFullExam = ex.lastFull && ex.lastFull.exam;
      const hasFullPractice = ex.lastFull && ex.lastFull.practice;
      const card = document.createElement("div");
      card.className = "card";
      card.innerHTML = `
        <div>
          <div class="name">${escapeHtml(ex.name)}</div>
          <div class="meta">${ex.questions.length} ข้อ · ใส่เฉลยแล้ว ${answered}/${ex.questions.length}</div>
          <div class="meta">
            📝 สอบจริงล่าสุด:
            ${lastExam
              ? (hasFullExam ? `<button class="small" data-act="viewExam" style="background:none; border:none; color:var(--teal); text-decoration:underline; cursor:pointer; padding:0; font-family:inherit;">${lastExam.correctCount}/${lastExam.keyed} (ดูอีกครั้ง)</button>` : `${lastExam.correctCount}/${lastExam.keyed}`)
              : "ยังไม่เคยทำ"}
            &nbsp;·&nbsp; ⚡ ฝึกล่าสุด:
            ${lastPractice
              ? (hasFullPractice ? `<button class="small" data-act="viewPractice" style="background:none; border:none; color:var(--teal); text-decoration:underline; cursor:pointer; padding:0; font-family:inherit;">${lastPractice.correctCount}/${lastPractice.keyed} (ดูอีกครั้ง)</button>` : `${lastPractice.correctCount}/${lastPractice.keyed}`)
              : "ยังไม่เคยทำ"}
          </div>
        </div>
        <div class="row" style="align-items:center;">
          <label class="small" style="display:flex; align-items:center; gap:4px; margin:0;">
            <input type="checkbox" id="shuf-${ex.id}" style="width:auto;"> สุ่มข้อ
          </label>
          <button class="btn ghost" data-act="rename" title="แก้ชื่อชุดข้อสอบ">✏️ ชื่อ</button>
          <button class="btn ghost" data-act="moveUp" ${examIndex===0 ? "disabled" : ""} title="เลื่อนขึ้น">↑</button>
          <button class="btn ghost" data-act="moveDown" ${examIndex===project.exams.length-1 ? "disabled" : ""} title="เลื่อนลง">↓</button>
          <button class="btn ghost" data-act="edit">แก้ไข/เฉลย</button>
          <button class="btn" data-act="examMode">📝 โหมดสอบจริง</button>
          <button class="btn clay" data-act="practiceMode">⚡ โหมดฝึก</button>
          <button class="btn danger" data-act="del">ลบ</button>
        </div>
      `;
      card.querySelector('[data-act="edit"]').onclick = ()=>{
        state.currentExamId = ex.id; state.activeTab="edit"; render();
      };
      card.querySelector('[data-act="rename"]').onclick = ()=>{
        const name = prompt("ชื่อชุดข้อสอบใหม่", ex.name);
        if(name===null) return;
        const trimmed = name.trim();
        if(!trimmed){ alert("กรุณาใส่ชื่อชุดข้อสอบ"); return; }
        ex.name = trimmed; save(); render();
      };
      card.querySelector('[data-act="moveUp"]').onclick = ()=>{
        if(examIndex===0) return;
        [project.exams[examIndex-1], project.exams[examIndex]] = [project.exams[examIndex], project.exams[examIndex-1]];
        save(); render();
      };
      card.querySelector('[data-act="moveDown"]').onclick = ()=>{
        if(examIndex>=project.exams.length-1) return;
        [project.exams[examIndex], project.exams[examIndex+1]] = [project.exams[examIndex+1], project.exams[examIndex]];
        save(); render();
      };
      card.querySelector('[data-act="examMode"]').onclick = ()=>{
        const shuffle = card.querySelector(`#shuf-${ex.id}`).checked;
        startQuiz(ex.id, "exam", {shuffle});
      };
      card.querySelector('[data-act="practiceMode"]').onclick = ()=>{
        const shuffle = card.querySelector(`#shuf-${ex.id}`).checked;
        startQuiz(ex.id, "practice", {shuffle});
      };
      card.querySelector('[data-act="del"]').onclick = ()=>{
        if(confirm(`ลบชุดข้อสอบ "${ex.name}" ?`)){
          project.exams = project.exams.filter(e=>e.id!==ex.id);
          save(); render();
        }
      };
      const viewExamBtn = card.querySelector('[data-act="viewExam"]');
      if(viewExamBtn) viewExamBtn.onclick = ()=> viewLastResult(ex.id, "exam");
      const viewPracticeBtn = card.querySelector('[data-act="viewPractice"]');
      if(viewPracticeBtn) viewPracticeBtn.onclick = ()=> viewLastResult(ex.id, "practice");
      panel.appendChild(card);
    });
  }
  wrap.appendChild(panel);

  setTimeout(()=>{
    document.getElementById("backBtn").onclick = ()=>{ state.currentProjectId = null; render(); };
    document.getElementById("exportProjBtn").onclick = ()=>{
      const safeName = project.name.replace(/[^\w\u0E00-\u0E7F\-]+/g,"_");
      exportJSON([project], `psu_quiz_${safeName}.json`);
    };
  },0);

  return wrap;
}

/* ---------------- TAB: edit ---------------- */
function renderEdit(){
  const wrap = document.createElement("div");
  const found = findExam(state.currentExamId);
  if(!found){
    wrap.innerHTML = `<div class="panel"><div class="empty">เลือกชุดข้อสอบจากแท็บ "② โปรเจกต์" ก่อน</div></div>`;
    return wrap;
  }
  const {exam, project} = found;

  const crumb = document.createElement("div");
  crumb.className = "crumb";
  crumb.textContent = `📁 ${project.name} / ${exam.name}`;
  wrap.appendChild(crumb);

  const head = document.createElement("div");
  head.className = "panel";
  head.innerHTML = `
    <div class="flex-between">
      <h2 style="border:none; margin:0;">${escapeHtml(exam.name)}</h2>
      <div class="row">
        <label class="small" style="display:flex; align-items:center; gap:6px; margin:0;">
          <input type="checkbox" id="reviewOnlyChk" style="width:auto;" ${state.editReviewOnly ? "checked" : ""}>
          ⚠️ แสดงเฉพาะข้อที่ต้องตรวจ
        </label>
        <button class="btn" id="addQBtn">+ เพิ่มข้อใหม่</button>
      </div>
    </div>
    <p class="small">แก้คำถาม/ตัวเลือก และเลือก "คำตอบที่ถูก" ของแต่ละข้อ ใส่เหตุผล (rationale) เพิ่มได้ ระบบบันทึกอัตโนมัติทุกครั้งที่แก้ · ${state.editReviewOnly ? `กำลังแสดง ${exam.questions.filter(q=>(q.issues||[]).length).length} ข้อที่ต้องตรวจ` : `ทั้งหมด ${exam.questions.length} ข้อ`}</p>
  `;
  wrap.appendChild(head);

  const keyPanel = document.createElement("div");
  keyPanel.className = "panel";
  keyPanel.innerHTML = `
    <h2>วางเฉลยจาก Claude (หรือรูปแบบอื่น)</h2>
    <p class="small">
      ก็อปเฉลยที่ Claude สร้างให้ (ไม่ว่าจะเป็น "1. B" หรือ "ข้อ 1 ตอบ: B เหตุผล: ..." หรือหัวข้อ
      markdown แบบ "## ข้อ 1" ตามด้วยบรรทัด "คำตอบ: B") มาวางในกล่องด้านล่าง ระบบจะจับคู่กับเลขข้อในชุดนี้ให้อัตโนมัติ —
      กด "ตรวจสอบ" ดูตัวอย่างก่อน แล้วค่อย "นำเข้าเฉลยทั้งหมด"
    </p>
    <textarea id="keyPasteBox" rows="8" placeholder="วางเฉลยที่นี่..."></textarea>
    <div class="row" style="margin-top:8px;">
      <button class="btn secondary" id="previewKeyBtn">ตรวจสอบ</button>
      <button class="btn clay" id="applyKeyBtn" disabled>นำเข้าเฉลยทั้งหมด</button>
      <label class="small" style="display:flex; align-items:center; gap:6px; margin:0;">
        <input type="checkbox" id="overwriteChk" checked style="width:auto;"> เขียนทับเฉลย/เหตุผลเดิมถ้ามีอยู่แล้ว
      </label>
    </div>
    <div id="keyPreview"></div>
  `;
  wrap.appendChild(keyPanel);

  const questionsToShow = state.editReviewOnly
    ? exam.questions.filter(q=>(q.issues||[]).length)
    : exam.questions;
  if(questionsToShow.length===0){
    const empty = document.createElement("div");
    empty.className = "panel";
    empty.innerHTML = `<div class="empty">ไม่มีข้อที่ถูกทำเครื่องหมายว่าต้องตรวจ</div>`;
    wrap.appendChild(empty);
  }

  questionsToShow.forEach((q)=>{
    const card = document.createElement("div");
    card.className = "qcard";
    let choicesHtml = "";
    ["A","B","C","D","E"].forEach(letter=>{
      choicesHtml += `
        <div class="choice-edit">
          <span>${letter}</span>
          <input type="text" data-letter="${letter}" data-field="choice" value="${escapeAttr(q.choices[letter]||"")}">
        </div>`;
    });
    card.innerHTML = `
      <div class="flex-between">
        <div class="qnum">ข้อจริง ${escapeHtml(q.sourceNumber||q.number)} · ลำดับในชุด ${exam.questions.indexOf(q)+1}</div>
        <button class="btn danger" data-act="delQ" style="padding:4px 10px; font-size:.78rem;">ลบข้อนี้</button>
      </div>
      ${(q.issues||[]).length ? `<div class="small" style="color:var(--clay); margin-bottom:8px;">⚠️ ต้องตรวจ: ${escapeHtml(q.issues.join(" · "))}</div>` : ""}
      <label>โจทย์</label>
      <textarea rows="3" data-field="stem">${escapeHtml(q.stem)}</textarea>

      <label style="margin-top:8px;">รูปภาพประกอบ (ถ้ามี เช่น CXR, H&E, EKG)</label>
      <div id="imgArea-${q.id}"></div>

      <label style="margin-top:8px;">ตัวเลือก</label>
      ${choicesHtml}
      <div class="row" style="margin-top:8px;">
        <div style="flex:1; min-width:160px;">
          <label>คำตอบที่ถูก</label>
          <select data-field="correct">
            <option value="">— ยังไม่ระบุ —</option>
            ${["A","B","C","D","E"].map(l=>`<option value="${l}" ${q.correct===l?"selected":""}>${l}</option>`).join("")}
          </select>
        </div>
        <div style="flex:2; min-width:220px;">
          <label>เหตุผล / คำอธิบาย (ไม่บังคับ)</label>
          <input type="text" data-field="explanation" value="${escapeAttr(q.explanation||"")}">
        </div>
      </div>
    `;
    renderImageArea(card.querySelector(`#imgArea-${q.id}`), q);
    card.querySelector('[data-field="stem"]').addEventListener("input", (e)=>{
      q.stem = e.target.value; save();
    });
    card.querySelectorAll('[data-field="choice"]').forEach(inp=>{
      inp.addEventListener("input", (e)=>{
        q.choices[e.target.dataset.letter] = e.target.value; save();
      });
    });
    card.querySelector('[data-field="correct"]').addEventListener("change", (e)=>{
      q.correct = e.target.value || null; save();
    });
    card.querySelector('[data-field="explanation"]').addEventListener("input", (e)=>{
      q.explanation = e.target.value; save();
    });
    card.querySelector('[data-act="delQ"]').addEventListener("click", ()=>{
      exam.questions = exam.questions.filter(qq=>qq.id!==q.id);
      save(); render();
    });
    wrap.appendChild(card);
  });

  setTimeout(()=>{
    document.getElementById("reviewOnlyChk").onchange = (e)=>{
      state.editReviewOnly = e.target.checked;
      render();
    };
    document.getElementById("addQBtn").onclick = ()=>{
      const highest = Math.max(0, ...exam.questions.map(q=>parseInt(q.number,10)||0));
      const number = String(highest+1);
      exam.questions.push({
        id: uid(), number, sourceNumber:number, stem: "",
        choices:{A:"",B:"",C:"",D:"",E:""}, issues:["เพิ่มด้วยมือ — กรุณาใส่โจทย์และตัวเลือก"], correct: null, explanation: "", image: null
      });
      save(); render();
    };

    document.getElementById("previewKeyBtn").onclick = ()=>{
      const text = document.getElementById("keyPasteBox").value;
      const parsed = parseAnswerKeyFlexible(text);
      const matches = parsed.map(p=>{
        const q = exam.questions.find(qq=>String(qq.number).trim()===String(p.number).trim());
        return {...p, q};
      });
      pendingKeyImport = matches;
      const matchedCount = matches.filter(m=>m.q && m.letter).length;
      const noLetterCount = matches.filter(m=>m.q && !m.letter).length;
      const noMatchCount = matches.filter(m=>!m.q).length;
      const box = document.getElementById("keyPreview");
      let html = `<hr class="sep"><p class="small">
        พบ ${parsed.length} รายการ — จับคู่และอ่านคำตอบได้ ${matchedCount} ข้อ
        ${noLetterCount ? ` · เจอเลขข้อแต่อ่านคำตอบไม่ได้ ${noLetterCount} ข้อ` : ""}
        ${noMatchCount ? ` · ไม่พบเลขข้อนี้ในชุดข้อสอบ ${noMatchCount} รายการ` : ""}
      </p>`;
      matches.slice(0,8).forEach(m=>{
        const status = !m.q ? `<span class="badge no">ไม่พบข้อ ${escapeHtml(m.number)}</span>`
          : !m.letter ? `<span class="badge pending">อ่านคำตอบไม่ได้</span>`
          : `<span class="badge ok">ข้อ ${escapeHtml(m.number)} → ${m.letter}</span>`;
        html += `<div class="review-row ${m.q && m.letter ? 'right':'wrong'}">
          <div class="flex-between"><div class="qnum">${status}</div></div>
          ${m.explanation ? `<div class="small" style="margin-top:4px;">${escapeHtml(m.explanation).slice(0,200)}</div>` : ""}
        </div>`;
      });
      if(matches.length>8){
        html += `<div class="small">...และอีก ${matches.length-8} รายการ</div>`;
      }
      box.innerHTML = html;
      document.getElementById("applyKeyBtn").disabled = matchedCount===0;
    };

    document.getElementById("applyKeyBtn").onclick = ()=>{
      if(!pendingKeyImport) return;
      const overwrite = document.getElementById("overwriteChk").checked;
      let applied = 0;
      pendingKeyImport.forEach(m=>{
        if(!m.q || !m.letter) return;
        if(!overwrite && m.q.correct) return;
        m.q.correct = m.letter;
        if(m.explanation && (overwrite || !m.q.explanation)){
          m.q.explanation = m.explanation;
        }
        applied++;
      });
      save();
      pendingKeyImport = null;
      alert(`นำเข้าเฉลยแล้ว ${applied} ข้อ`);
      render();
    };
  },0);

  return wrap;
}

/* ---------------- TAB: quiz ---------------- */
function shuffleArray(arr){
  const a = arr.slice();
  for(let i=a.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [a[i],a[j]] = [a[j],a[i]];
  }
  return a;
}

function startQuiz(examId, mode, opts={}){
  const found = findExam(examId);
  if(!found || found.exam.questions.length===0) return;
  let ids = found.exam.questions.map(q=>q.id);
  if(opts.shuffle) ids = shuffleArray(ids);
  state.quiz = {
    examId, mode,
    order: ids.slice(),
    originalOrder: ids.slice(),
    idx: 0,
    answers: {},
    revealed: false,
    shuffle: !!opts.shuffle,
    round: 1,
    wrongIds: [],       // questions answered wrong in the CURRENT round (practice mode)
    firstAttempt: {},   // qid -> {answer, correct} recorded only on first-ever answer (practice mode scoring)
    flagged: [],         // qids marked "ไม่ชัวร์" (exam mode)
    isReview: false
  };
  state.lastResult = null;
  state.activeTab = "quiz";
  render();
}

function startFlaggedReview(examId, ids){
  const found = findExam(examId);
  if(!found || !ids || ids.length===0) return;
  state.quiz = {
    examId, mode: "exam",
    order: ids.slice(),
    originalOrder: ids.slice(),
    idx: 0,
    answers: {},
    revealed: false,
    shuffle: false,
    round: 1,
    wrongIds: [],
    firstAttempt: {},
    flagged: [],
    isReview: true
  };
  state.lastResult = null;
  state.activeTab = "quiz";
  render();
}

function viewLastResult(examId, mode){
  const found = findExam(examId);
  if(!found) return;
  const lf = found.exam.lastFull && found.exam.lastFull[mode];
  if(!lf) return;
  const rows = lf.rows
    .map(r=>{
      const q = found.exam.questions.find(qq=>qq.id===r.qId);
      if(!q) return null;
      const isCorrect = !!(q.correct && r.userAns === q.correct);
      return {q, userAns: r.userAns, isCorrect};
    })
    .filter(Boolean);
  const keyed = rows.filter(r=>r.q.correct).length;
  const correctCount = rows.filter(r=>r.isCorrect).length;
  state.lastResult = {
    examId, examName: found.exam.name, mode,
    isReview: true, flaggedIds: [],
    total: rows.length, keyed, correctCount, rows
  };
  state.activeTab = "result";
  render();
}

function startNextRound(){
  const ids = Array.from(new Set(state.quiz.wrongIds));
  state.quiz.round += 1;
  state.quiz.order = state.quiz.shuffle ? shuffleArray(ids) : ids;
  state.quiz.wrongIds = [];
  state.quiz.idx = 0;
  state.quiz.revealed = false;
  render();
}

function goToIndex(newIdx){
  state.quiz.idx = newIdx;
  const qid = state.quiz.order[newIdx];
  state.quiz.revealed = state.quiz.mode==="practice" && !!state.quiz.answers[qid];
  render();
}

function renderQuiz(){
  const wrap = document.createElement("div");
  const found = findExam(state.quiz.examId);
  if(!found){
    const panel = document.createElement("div");
    panel.className = "panel";
    panel.innerHTML = `<div class="empty">ยังไม่ได้เลือกชุดข้อสอบ — ไปที่แท็บ "② โปรเจกต์" แล้วเลือกโหมดทำข้อสอบจากชุดที่ต้องการ</div>`;
    wrap.appendChild(panel);
    return wrap;
  }
  const {exam} = found;
  const q = exam.questions.find(qq=>qq.id===state.quiz.order[state.quiz.idx]);
  const total = state.quiz.order.length;
  const isPractice = state.quiz.mode === "practice";
  const revealed = isPractice && state.quiz.revealed;
  const userAns = state.quiz.answers[q.id] || null;
  const isLast = state.quiz.idx === total-1;
  const roundTag = isPractice && state.quiz.round>1 ? ` · รอบทบทวนที่ ${state.quiz.round-1}` : "";
  const isFlagged = !isPractice && state.quiz.flagged && state.quiz.flagged.includes(q.id);

  const panel = document.createElement("div");
  panel.className = "panel";
  panel.innerHTML = `
    <div class="flex-between" style="align-items:flex-start;">
      <div class="quiz-progress" style="margin-bottom:0;">${escapeHtml(exam.name)} — ข้อ ${state.quiz.idx+1} / ${total}${roundTag}
        <span class="mode-tag">${isPractice ? "⚡ โหมดฝึก" : "📝 โหมดสอบจริง"}</span>
        ${state.quiz.shuffle ? `<span class="mode-tag">🔀 สุ่มข้อ</span>` : ""}
      </div>
      ${!isPractice ? `
        <button id="flagBtn" class="btn ${isFlagged ? 'danger' : 'ghost'}" style="border-radius:20px; padding:5px 12px; font-size:.8rem; white-space:nowrap;">
          ${isFlagged ? "🔴 ไม่ชัวร์" : "⚪ ไม่ชัวร์?"}
        </button>` : ""
      }
    </div>
    ${q.image ? `<img src="${q.image}" style="max-width:100%; border:1px solid var(--line); border-radius:8px; margin:12px 0 14px; display:block;">` : ""}
    <div class="quiz-q">${escapeHtml(q.number)}. ${escapeHtml(q.stem)}</div>
    <div id="choicesArea"></div>
    <div id="revealArea"></div>
    <div class="nav-row">
      <button class="btn secondary" id="prevBtn" ${state.quiz.idx===0?"disabled":""}>← ข้อก่อนหน้า</button>
      <span id="nextSlot"></span>
    </div>
  `;
  wrap.appendChild(panel);

  const flagBtn = panel.querySelector("#flagBtn");
  if(flagBtn){
    flagBtn.onclick = ()=>{
      const i = state.quiz.flagged.indexOf(q.id);
      if(i>=0) state.quiz.flagged.splice(i,1);
      else state.quiz.flagged.push(q.id);
      render();
    };
  }

  const nextSlot = panel.querySelector("#nextSlot");
  if(!isLast){
    nextSlot.innerHTML = `<button class="btn" id="nextBtn">ข้อถัดไป →</button>`;
  } else if(isPractice){
    const wrongCount = new Set(state.quiz.wrongIds).size;
    // last item of round not yet revealed -> hide nav button until answered, unless already revealed
    if(revealed || wrongCount>0){
      nextSlot.innerHTML = wrongCount>0
        ? `<button class="btn clay" id="reviewBtn">🔁 ทบทวนข้อที่ตอบผิด (${wrongCount} ข้อ)</button>`
        : `<button class="btn clay" id="submitBtn">ดูผลสรุปทั้งหมด</button>`;
    } else {
      nextSlot.innerHTML = `<button class="btn" id="waitBtn" disabled>ตอบข้อนี้ก่อนเพื่อดูสรุป</button>`;
    }
  } else {
    nextSlot.innerHTML = `<button class="btn clay" id="submitBtn">ส่งคำตอบ / ดูคะแนน</button>`;
  }

  const choicesArea = panel.querySelector("#choicesArea");
  ["A","B","C","D","E"].forEach(letter=>{
    if(!q.choices[letter]) return;
    const b = document.createElement("button");
    let cls = "choice-btn";
    if(!revealed && userAns===letter) cls += " selected";
    if(revealed){
      if(q.correct && letter===q.correct) cls += " correct";
      else if(letter===userAns) cls += " incorrect";
    }
    b.className = cls;
    b.textContent = letter + ". " + q.choices[letter];
    if(revealed) b.disabled = true;
    b.onclick = ()=>{
      if(isPractice){
        if(state.quiz.revealed) return;
        state.quiz.answers[q.id] = letter;
        state.quiz.revealed = true;
        if(!(q.id in state.quiz.firstAttempt)){
          state.quiz.firstAttempt[q.id] = {answer: letter, correct: q.correct ? (letter===q.correct) : null};
        }
        if(q.correct && letter !== q.correct){
          state.quiz.wrongIds.push(q.id);
        }
        render();
      } else {
        state.quiz.answers[q.id] = letter;
        render();
      }
    };
    choicesArea.appendChild(b);
  });

  if(revealed){
    const revealArea = panel.querySelector("#revealArea");
    const isCorrect = q.correct && userAns === q.correct;
    const box = document.createElement("div");
    box.className = "reveal-box " + (q.correct ? (isCorrect ? "ok" : "no") : "");
    if(!q.correct){
      box.innerHTML = `<b>ยังไม่ได้ใส่เฉลยข้อนี้ไว้</b> — ไปเพิ่มเฉลยได้ที่แท็บ "③ แก้ไข/เฉลย"`;
    } else {
      box.innerHTML = `<b>${isCorrect ? "✅ ถูกต้อง" : "❌ ยังไม่ถูก — จะเจอข้อนี้อีกครั้งในรอบทบทวน"}</b> — เฉลย: <b>${q.correct}</b>
        ${q.explanation ? `<div class="small" style="margin-top:6px; white-space:pre-wrap;">${escapeHtml(q.explanation)}</div>` : ""}`;
    }
    revealArea.appendChild(box);
  }

  setTimeout(()=>{
    const prevBtn = document.getElementById("prevBtn");
    if(prevBtn) prevBtn.onclick = ()=>{ goToIndex(state.quiz.idx-1); };
    const nextBtn = document.getElementById("nextBtn");
    if(nextBtn) nextBtn.onclick = ()=>{ goToIndex(state.quiz.idx+1); };
    const reviewBtn = document.getElementById("reviewBtn");
    if(reviewBtn) reviewBtn.onclick = ()=>{ startNextRound(); };
    const submitBtn = document.getElementById("submitBtn");
    if(submitBtn) submitBtn.onclick = ()=>{ finishQuiz(); };
  },0);

  wrap.appendChild(renderNotepad(exam));

  return wrap;
}

/* ---------------- floating per-exam notepad ---------------- */
let notepadOpen = false;
function renderNotepad(exam){
  const holder = document.createElement("div");
  holder.style.position = "fixed";
  holder.style.right = "16px";
  holder.style.bottom = "16px";
  holder.style.zIndex = "50";
  holder.style.display = "flex";
  holder.style.flexDirection = "column";
  holder.style.alignItems = "flex-end";
  holder.style.gap = "8px";

  if(notepadOpen){
    const box = document.createElement("div");
    box.style.width = "270px";
    box.style.maxWidth = "82vw";
    box.style.background = "#fffdf8";
    box.style.border = "1px solid var(--line)";
    box.style.borderRadius = "10px";
    box.style.padding = "10px";
    box.style.boxShadow = "0 6px 18px rgba(0,0,0,.18)";
    box.innerHTML = `
      <div class="flex-between" style="margin-bottom:6px;">
        <b class="small">📝 โน้ต — ${escapeHtml(exam.name)}</b>
        <button id="notepadCloseBtn" class="btn ghost" style="padding:2px 8px; font-size:.72rem;">ปิด</button>
      </div>
      <textarea id="notepadText" rows="7" placeholder="จดคำศัพท์ / จุดที่ไม่เข้าใจของข้อสอบชุดนี้...">${escapeHtml(exam.notes||"")}</textarea>
      <div class="small" style="margin-top:4px;">บันทึกอัตโนมัติ · แยกเก็บเฉพาะชุดนี้</div>
    `;
    holder.appendChild(box);
  }

  const toggleBtn = document.createElement("button");
  toggleBtn.style.background = "var(--clay)";
  toggleBtn.style.color = "#fff";
  toggleBtn.style.border = "none";
  toggleBtn.style.borderRadius = "50%";
  toggleBtn.style.width = "48px";
  toggleBtn.style.height = "48px";
  toggleBtn.style.fontSize = "1.25rem";
  toggleBtn.style.cursor = "pointer";
  toggleBtn.style.boxShadow = "0 4px 12px rgba(0,0,0,.2)";
  toggleBtn.textContent = notepadOpen ? "✕" : "📝";
  toggleBtn.onclick = ()=>{ notepadOpen = !notepadOpen; render(); };
  holder.appendChild(toggleBtn);

  setTimeout(()=>{
    const closeBtn = document.getElementById("notepadCloseBtn");
    if(closeBtn) closeBtn.onclick = ()=>{ notepadOpen=false; render(); };
    const ta = document.getElementById("notepadText");
    if(ta) ta.addEventListener("input", (e)=>{ exam.notes = e.target.value; save(); });
  },0);

  return holder;
}

function finishQuiz(){
  const found = findExam(state.quiz.examId);
  const exam = found.exam;
  let rows, correctCount, keyed, total;

  if(state.quiz.mode === "practice"){
    // score reflects the FIRST time each question was answered, not repeat-review rounds
    rows = state.quiz.originalOrder.map(id=>{
      const q = exam.questions.find(qq=>qq.id===id);
      const fa = state.quiz.firstAttempt[id];
      const userAns = fa ? fa.answer : null;
      const isCorrect = !!(fa && fa.correct === true);
      return {q, userAns, isCorrect};
    });
  } else {
    rows = state.quiz.order.map(id=>{
      const q = exam.questions.find(qq=>qq.id===id);
      const userAns = state.quiz.answers[q.id] || null;
      const isCorrect = q.correct && userAns === q.correct;
      return {q, userAns, isCorrect};
    });
  }
  keyed = rows.filter(r=>r.q.correct).length;
  correctCount = rows.filter(r=>r.isCorrect).length;
  total = rows.length;

  if(!state.quiz.isReview){
    exam.history = exam.history || {exam:[], practice:[]};
    exam.history[state.quiz.mode] = exam.history[state.quiz.mode] || [];
    exam.history[state.quiz.mode].unshift({date: Date.now(), correctCount, keyed, total});
    exam.history[state.quiz.mode] = exam.history[state.quiz.mode].slice(0,20);

    // persist full per-question snapshot so this exact result can be reopened later ("ดูอีกครั้ง")
    exam.lastFull = exam.lastFull || {};
    exam.lastFull[state.quiz.mode] = {
      date: Date.now(),
      rows: rows.map(r=>({qId: r.q.id, userAns: r.userAns}))
    };
    save();
  }

  state.lastResult = {
    examId: exam.id,
    examName: exam.name,
    mode: state.quiz.mode,
    isReview: !!state.quiz.isReview,
    flaggedIds: (state.quiz.flagged || []).slice(),
    total, keyed, correctCount,
    rows
  };
  state.activeTab = "result";
  render();
}

/* ---------------- TAB: result ---------------- */
function renderResult(){
  const wrap = document.createElement("div");
  const r = state.lastResult;
  if(!r){
    wrap.innerHTML = `<div class="panel"><div class="empty">ยังไม่มีผลคะแนน — ไปทำข้อสอบที่แท็บ "④ ทำข้อสอบ" ก่อน</div></div>`;
    return wrap;
  }
  const hero = document.createElement("div");
  hero.className = "panel score-hero";
  const pct = r.keyed>0 ? Math.round((r.correctCount/r.keyed)*100) : 0;
  hero.innerHTML = `
    <div class="small">${escapeHtml(r.examName)} <span class="mode-tag">${r.mode==="practice" ? "⚡ โหมดฝึก" : "📝 โหมดสอบจริง"}</span></div>
    <div class="num">${r.correctCount} / ${r.keyed}</div>
    <div class="sub">ตอบถูก ${r.correctCount} จาก ${r.keyed} ข้อที่มีเฉลย (${pct}%)${r.total>r.keyed ? ` · อีก ${r.total-r.keyed} ข้อยังไม่ได้ใส่เฉลยไว้ ระบบไม่นับคะแนน` : ""}</div>
  `;
  wrap.appendChild(hero);

  const found = findExam(r.examId);
  if(found && found.exam.history && found.exam.history[r.mode] && found.exam.history[r.mode].length>1){
    const histPanel = document.createElement("div");
    histPanel.className = "panel";
    histPanel.innerHTML = `<h2>ประวัติการทำ${r.mode==="practice" ? "โหมดฝึก" : "โหมดสอบจริง"} (ชุดนี้)</h2>`;
    found.exam.history[r.mode].forEach((h,i)=>{
      const p = h.keyed>0 ? Math.round((h.correctCount/h.keyed)*100) : 0;
      const row = document.createElement("div");
      row.className = "small";
      row.style.padding = "4px 0";
      row.style.borderBottom = i < found.exam.history[r.mode].length-1 ? "1px solid var(--line)" : "none";
      row.textContent = `${new Date(h.date).toLocaleString("th-TH",{dateStyle:"short", timeStyle:"short"})} — ${h.correctCount}/${h.keyed} (${p}%)`;
      histPanel.appendChild(row);
    });
    wrap.appendChild(histPanel);
  }

  const list = document.createElement("div");
  list.className = "panel";
  list.innerHTML = `<h2>เฉลยรายข้อ</h2>`;
  r.rows.forEach(({q,userAns,isCorrect})=>{
    const row = document.createElement("div");
    let cls = "review-row ";
    let badge = `<span class="badge pending">ไม่มีเฉลย</span>`;
    if(q.correct){
      cls += isCorrect ? "right" : "wrong";
      badge = isCorrect ? `<span class="badge ok">ถูก</span>` : `<span class="badge no">ผิด</span>`;
    }
    row.className = cls;
    row.innerHTML = `
      <div class="flex-between">
        <div class="qnum">ข้อ ${escapeHtml(q.number)}</div>
        ${badge}
      </div>
      ${q.image ? `<img src="${q.image}" style="max-width:100%; max-height:220px; border:1px solid var(--line); border-radius:6px; margin:6px 0; display:block;">` : ""}
      <div style="margin:6px 0; white-space:pre-wrap;">${escapeHtml(q.stem)}</div>
      <div class="small">คำตอบของคุณ: <b>${userAns || "— ไม่ได้ตอบ —"}</b>${q.correct ? ` &nbsp;·&nbsp; เฉลย: <b>${q.correct}</b>` : ""}</div>
      ${q.explanation ? `<div class="small" style="margin-top:4px;">เหตุผล: ${escapeHtml(q.explanation)}</div>` : ""}
    `;
    list.appendChild(row);
  });
  wrap.appendChild(list);

  const again = document.createElement("div");
  again.className = "panel";
  const hasFlagged = r.mode==="exam" && r.flaggedIds && r.flaggedIds.length>0;
  again.innerHTML = `
    ${hasFlagged ? `<p class="small">คุณทำเครื่องหมาย "ไม่ชัวร์" ไว้ ${r.flaggedIds.length} ข้อระหว่างทำ</p>` : ""}
    <div class="row">
      ${hasFlagged ? `<button class="btn danger" id="flaggedReviewBtn">🔴 ทำข้อที่ติ๊กไว้ใหม่ (${r.flaggedIds.length} ข้อ)</button>` : ""}
      <button class="btn" id="retryExamBtn">📝 ทำชุดนี้อีกครั้ง (สอบจริง)</button>
      <button class="btn clay" id="retryPracticeBtn">⚡ ทำชุดนี้อีกครั้ง (ฝึก)</button>
    </div>
  `;
  wrap.appendChild(again);
  setTimeout(()=>{
    document.getElementById("retryExamBtn").onclick = ()=> startQuiz(r.examId, "exam");
    document.getElementById("retryPracticeBtn").onclick = ()=> startQuiz(r.examId, "practice");
    const flaggedBtn = document.getElementById("flaggedReviewBtn");
    if(flaggedBtn) flaggedBtn.onclick = ()=> startFlaggedReview(r.examId, r.flaggedIds);
  },0);

  return wrap;
}

/* ---------------- helpers ---------------- */
function escapeHtml(s){
  return String(s||"").replace(/[&<>"']/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
}
function escapeAttr(s){ return escapeHtml(s); }

/* ---------------- boot ---------------- */
load();
render();
autoSyncIfEmpty();
</script>
</body>
</html>
